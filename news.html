<!DOCTYPE html>
<html lang="zh-CN">
<link rel="stylesheet" href="https://cdn.bootcdn.net/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<head>
	<meta charset="UTF-8">
	<title>我的新闻中心</title>
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<style>
		body {
			font-family: 'Microsoft YaHei', sans-serif;
			background: #f5f7fa;
			text-align: center;
			margin: 0;
			padding: 40px 20px;
		}

		h1 {
			color: #333;
			margin-bottom: 30px;
		}

		.grid {
			display: flex;
			flex-wrap: wrap;
			justify-content: center;
			gap: 25px;
		}

		.card {
			width: 120px;
			height: 120px;
			background: #fff;
			border-radius: 16px;
			box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
			transition:
				transform 0.2s,
				box-shadow 0.2s;
			text-align: center;
			padding: 10px;
			text-decoration: none;
			/* ✅ 新增 */
			display: flex;
			flex-direction: column;
			justify-content: center;
			/* 垂直居中 */
			align-items: center;
			/* 水平居中 */
		}

		.card:hover {
			transform: translateY(-6px);
			box-shadow: 0 8px 16px rgba(0, 0, 0, 0.15);
		}

		.card img {
			width: 48px;
			height: 48px;
		}

		.card span {
			display: block;
			margin-top: 10px;
			color: #333;
			font-size: 14px;
		}
	</style>
</head>

<body>
	<h1>📰 我的新闻中心</h1>
	<div class="grid">

		<a href="https://www.bbc.com" target="_blank" class="card">
			<img src="https://www.google.com/s2/favicons?sz=64&domain=bbc.com" alt="BBC">
			<span>BBC</span>
		</a>

		<a href="https://edition.cnn.com" target="_blank" class="card">
			<img src="https://www.google.com/s2/favicons?sz=64&domain=cnn.com" alt="CNN">
			<span>CNN</span>
		</a>

		<a href="https://www.reuters.com" target="_blank" class="card">
			<img src="https://www.google.com/s2/favicons?sz=64&domain=reuters.com" alt="Reuters">
			<span>路透社</span>
		</a>
		<a href="https://cn.nikkei.com/" target="_blank" class="card">
			<img src="https://www.nikkei.com/favicon.ico" alt="日经新闻">
			<span>日经新闻</span>
		</a>
		<a href="https://www.euronews.com/" target="_blank" class="card">
			<i class="fa-solid fa-fan" style="font-size: xx-large; color:rgb(12, 236, 42)" alt="欧洲新闻"></i>
			<span>欧洲新闻</span>
		</a>
		<a href="https://tw.yahoo.com/" target="_blank" class="card">

			<span>雅虎台湾</span>
		</a>

	</div>
</body>

</html>

<!DOCTYPE html>
<html lang="zh-CN">

<head>
	<meta charset="UTF-8">
	<title>我的React</title>
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<style>
		body {
			font-family: "Microsoft YaHei", sans-serif;
			background: #f5f7fa;
			text-align: center;
			margin: 0;
			padding: 40px 20px;
		}

		h1 {
			color: #333;
			margin-bottom: 30px;
		}

		.grid {
			display: flex;
			flex-wrap: wrap;
			justify-content: center;
			gap: 25px;
		}

		.card {
			width: 120px;
			height: 120px;
			background: #fff;
			border-radius: 16px;
			box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
			transition: transform 0.2s, box-shadow 0.2s;
			text-align: center;
			padding: 10px;
			text-decoration: none;
		}

		.card:hover {
			transform: translateY(-6px);
			box-shadow: 0 8px 16px rgba(0, 0, 0, 0.15);
		}

		.card img {
			width: 48px;
			height: 48px;
			margin-top: 10px;
		}

		.card span {
			display: block;
			margin-top: 10px;
			color: #333;
			font-size: 14px;
		}
	</style>
</head>

<body>
	<h1>📰 我的React</h1>
	<div class="grid">

		<a href="https://react.docschina.org/reference/react" target="_blank" class="card">
			<img src="https://www.google.com/s2/favicons?sz=64&domain=react.docschina.org" alt="React">
			<span>React中文参考</span>
		</a>

		<a href="https://react.dev/reference/react" target="_blank" class="card">
			<img src="https://www.google.com/s2/favicons?sz=64&domain=react.dev" alt="React">
			<span>React英文官方参考</span>
		</a>

		<a href="https://quilljs.com/docs/modules/" target="_blank" class="card">
			<img src="https://www.google.com/s2/favicons?sz=64&domain=quilljs.com" alt="Quill">
			<span>Quill模块文档</span>
		</a>

		<a href="https://www.npmjs.com/package/react-quill-new" target="_blank" class="card">
			<img src="https://www.npmjs.com/static/images/favicon.ico" alt="React Quill New">
			<span>React Quill New</span>
		</a>

		<a href="https://primer.style/octicons/" target="_blank" class="card">
			<img src="https://primer.style/octicons/favicon.ico" alt="Octicons">
			<span>Octicons图标</span>
		</a>

		<a href="https://www.w3school.com.cn/" target="_blank" class="card">
			<img src="https://www.w3school.com.cn/favicon.ico" alt="W3School">
			<span>W3School</span>
		</a>


	</div>
</body>

</html>
